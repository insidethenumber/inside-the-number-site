name: X posts

# Posts to @thenumberdesk four times a day, on GitHub's servers.
#
# This does NOT run on Chuck's laptop and does not touch Claude in Chrome.
# Both of those have failed repeatedly: Chrome froze twice on Aug 24 alone,
# and the local automation missed or ran late four days out of five. A GitHub
# runner has real outbound network, so it can reach api.x.com directly — which
# neither the Claude sandbox nor a browser can do.

on:
  schedule:
    # UTC. Central is UTC-5 in summer, UTC-6 in winter, so these drift an hour
    # seasonally — acceptable for social posting.
    #
    # POLL, DON'T SCHEDULE (changed Aug 25, 2026 — second attempt).
    #
    # First attempt was to move the three crons off the top of the hour, on the
    # theory that ":00" is the most congested minute on GitHub's scheduler.
    # That theory is probably right — daily-slate at ":30" fires reliably while
    # every ":00" job here was late or missing — but it did not fix this
    # workflow. The 12:17 slot didn't fire either.
    #
    # So stop depending on any single trigger landing. This now wakes up every
    # 20 minutes and asks post_queue.py --if-due whether a post is owed:
    # "have fewer posts gone out today than windows have opened?" A dropped
    # trigger is covered by the next one twenty minutes later. Volume is still
    # capped at three a day because the SENT COUNT gates it, not the clock.
    #
    # Costs nothing: Actions minutes are free on a public repo, and a run that
    # isn't due exits in seconds without touching the X API.
    - cron: "*/20 14-23 * * *"   # every 20 min, 9am-6pm CDT (covers CST too)
    #
    # Cut from four posts a day to three on Aug 25, 2026 — Chuck's call.
    # The dropped slot was 8:00pm CDT ("build-in-public"). It was the weakest
    # of the four: it talked about us rather than about a number, and nothing
    # in the first week's engagement came from that format. Every like and
    # reply we've earned came from a specific, checkable observation about a
    # player or a price. Three of those beat three of those plus one about
    # ourselves.
  workflow_dispatch:

concurrency:
  # Two runs posting at once would double-post and corrupt the queue state.
  group: x-posts
  cancel-in-progress: false

permissions:
  contents: write          # to commit posts/.sent.json back

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post the next item in the queue
        env:
          X_API_KEY:       ${{ secrets.X_API_KEY }}
          X_API_SECRET:    ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:  ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          # workflow_dispatch (a human clicking Run) posts immediately.
          # The 20-minute poll only posts when one is actually owed.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/post_queue.py
          else
            python3 scripts/post_queue.py --if-due
          fi

      - name: Record what went out
        run: |
          git config user.name  "ITN Desk"
          git config user.email "desk@insidethenumber.com"
          git add posts/.sent.json
          if git diff --cached --quiet; then
            echo "queue unchanged — nothing was sent"
          else
            git commit -m "X: posted queue item [skip ci]"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Warn when the queue runs low
        run: python3 scripts/post_queue.py --status

      - name: Report failure loudly
        if: failure()
        run: |
          echo "::error title=X post failed::Check credits at console.x.com and \
          the run log. Auth, billing and rate limits each report differently."
