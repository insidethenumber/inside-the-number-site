name: Daily slate

# Runs on GitHub's servers, not Chuck's laptop.
#
# Why this exists: the local automation missed or ran late on Aug 20, 21, 23
# and 24. Every failure was one of two things — a stale .git lock that could
# not be removed from the automation sandbox, or Claude in Chrome freezing
# mid-run. A GitHub runner has neither: fresh checkout every time, no shared
# filesystem, no browser, and it does not care whether the laptop is open,
# asleep, or in a bag on the way to work.

on:
  schedule:
    # Times are UTC. Central is UTC-5 in daylight saving, UTC-6 in winter.
    # 14:30 UTC = 9:30am CDT — well before the 1pm target, so a failure still
    # leaves hours to react.
    #
    # MINUTE CHOICE MATTERS. GitHub runs `schedule` on a best-effort basis and
    # drops runs outright under load — it never reports the drop, and there is
    # no failed run to find afterwards, just silence. The top of the hour and
    # :30 are by far the most contended minutes because that is where everyone
    # puts their crons. On Aug 26-27 2026 both of this workflow's :30 runs were
    # dropped two days running, brief-latest.json quietly went two days stale,
    # and the /g/ pages served Aug 25 games the whole time. Moved to odd
    # minutes, and a third pass added so one dropped run is not the whole day.
    # MOVED EARLIER Sep 2, 2026. The newsletter routine used to start at
    # 10:06am, so a 9:17 build was comfortably ahead of it. On Sep 2 the send
    # was retimed to a fixed 10:00am inbox slot with the build starting at
    # 8:00am — which put the 9:17 pass AFTER the thing that consumes it, so
    # every weekday run would have opened a stale brief and had to trigger
    # this workflow by hand first. First pass now lands before the 8:00 start.
    - cron: "41 11 * * *"    #  6:41am CDT — first pass, ahead of the 8:00am build
    - cron: "17 14 * * *"    #  9:17am CDT — second pass, catches a dropped first
    - cron: "47 16 * * *"    # 11:47am CDT — third pass
    - cron: "23 19 * * *"    #  2:23pm CDT — late catch-all; idempotent if the
                             #               earlier passes already committed
  workflow_dispatch:        # lets Chuck trigger a run by hand from the UI

concurrency:
  # Never let two runs edit index.html at once.
  group: daily-slate
  cancel-in-progress: false

permissions:
  contents: write           # needed to commit the updated slate

jobs:
  slate:
    runs-on: ubuntu-latest
    timeout-minutes: 12     # fail loudly rather than hang like the old runs did

    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe the feeds from this runner
        # ESPN answers a browser fine but may refuse datacenter IPs, which is
        # what a GitHub runner is. Prove which it is, in the run summary, rather
        # than inferring from an empty result.
        run: |
          {
            echo "## Feed reachability from this runner"
            echo ""
            echo '| feed | HTTP | bytes |'
            echo '| --- | --- | --- |'
            for u in \
              "https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard?dates=$(date -u +%Y%m%d)" \
              "https://statsapi.mlb.com/api/v1/teams?sportId=1" ; do
              code=$(curl -s -o /tmp/probe -w '%{http_code}' -m 20 "$u" || echo "000")
              size=$(wc -c < /tmp/probe 2>/dev/null || echo 0)
              name=$(echo "$u" | cut -d/ -f3)
              echo "| $name | $code | $size |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build today's brief from the public feeds
        id: brief
        run: |
          set -o pipefail
          python3 scripts/build_slate.py --out brief.json 2>&1 | tee /tmp/slate.log
          {
            echo ""
            echo "## Slate builder output"
            echo '```'
            cat /tmp/slate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "games=$(python3 -c 'import json;print(len(json.load(open("brief.json"))["games"]))')" >> "$GITHUB_OUTPUT"

      - name: Show what was found
        run: |
          python3 - <<'PY'
          import json
          b = json.load(open("brief.json"))
          print(f"slate: {b['slate_label']}  ({len(b['games'])} games not started)")
          print("non-MLB available:", ", ".join(b["non_mlb_available"]) or "none")
          PY

      - name: Commit the brief
        run: |
          git config user.name  "ITN Desk"
          git config user.email "desk@insidethenumber.com"
          mkdir -p data
          mv brief.json "data/brief-$(date -u +%Y-%m-%d).json"
          cp "data/brief-$(date -u +%Y-%m-%d).json" data/brief-latest.json
          # One static, indexable page per game (g/), straight from the brief.
          # Pure transform — if the brief built, this cannot add a failure mode.
          python3 scripts/build_game_pages.py --brief data/brief-latest.json
          git add data/ g/
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Slate brief for $(date -u +%Y-%m-%d)"
            # Rebase rather than force — a human may have pushed in between.
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Report failure loudly
        if: failure()
        run: |
          echo "::error title=Daily slate failed::The brief did not build. \
          Check the feeds and rerun with workflow_dispatch."
