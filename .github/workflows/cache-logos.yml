name: Cache team logos

# Run by hand when a league's team list changes (realignment, rebrands, a new
# season). Logos almost never move, so there is no schedule — this exists so
# the card generator has local files to draw with, because the environment
# that generates cards cannot reach ESPN's CDN.

on:
  workflow_dispatch:
    inputs:
      league:
        description: "One league (MLB/NFL/CFB/NBA/NHL/CBB), or blank for all"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch display fonts (the sandbox cannot; the runner can)
        run: |
          mkdir -p assets/fonts
          for f in ofl/anton/Anton-Regular.ttf \
                   ofl/barlowcondensed/BarlowCondensed-Bold.ttf \
                   ofl/barlowcondensed/BarlowCondensed-SemiBold.ttf \
                   ofl/barlow/Barlow-Medium.ttf; do
            curl -sSL --retry 3 -o "assets/fonts/$(basename "$f")" \
              "https://raw.githubusercontent.com/google/fonts/main/$f" || echo "miss: $f"
          done
          ls -la assets/fonts

      - name: Fetch logos
        run: |
          if [ -n "${{ github.event.inputs.league }}" ]; then
            python3 scripts/fetch_logos.py --league "${{ github.event.inputs.league }}"
          else
            python3 scripts/fetch_logos.py
          fi

      - name: Commit whatever is new
        run: |
          git config user.name  "ITN Desk"
          git config user.email "desk@insidethenumber.com"
          git add -f assets/logos assets/fonts
          if git diff --cached --quiet; then
            echo "no new logos"
          else
            git commit -m "Cache team logos + display fonts [skip ci]"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
