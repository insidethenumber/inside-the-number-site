name: UFC card page

# Regenerates ufc.html with fresh best-of-book prices. One Odds API credit
# per run.
#
# Daily through fight week so the "Prices updated" stamp stays honest —
# a static odds page with stale numbers is worse than no page, because the
# whole pitch is that the numbers are checked. The Saturday morning run lands
# before the card starts (fights begin ~5am CT / 10:00 UTC).
#
# After Saturday, switch the cron off (or retarget --start/--end at the next
# card) rather than letting it regenerate an empty window: the generator
# refuses to write a page with no fights, so a stale cron fails loudly
# instead of publishing junk.

on:
  # Re-enabled Aug 30 2026. The three bugs that caused the Aug 29 incident are
  # fixed and unit-tested in scripts/build_ufc_page.py:
  #   1) priced events are now discarded unless they appear on ESPN's roster
  #      for this card, so other promotions can no longer bleed onto the page;
  #   2) the main event is identified by its five-round format rather than by
  #      sort order (the odds feed gives every bout the same commence_time,
  #      which is why the old reverse-sort headlined the wrong fight);
  #   3) the build refuses to run unless ESPN reports the card as
  #      STATUS_SCHEDULED, so a finished card can no longer be published as
  #      shoppable odds. --allow-finished is required to override.
  # The guard runs BEFORE the odds call, so a stale window costs no credit.
  # SCHEDULE DISABLED Sep 14 2026. Noche UFC (Sep 12) is fought. The generator
  # correctly refuses to publish a finished card, so this cron failed every
  # morning Sep 13 and Sep 14 and emailed Chuck each time. A watchdog that
  # cries wolf daily trains you to ignore it, which is worse than no watchdog.
  #
  # TO RE-ENABLE for the next numbered card: uncomment the cron below and
  # point --start/--end at that card's window. Until then run it by hand from
  # the Actions tab (workflow_dispatch stays live).
  # RE-ARMED Sep 25 2026 for UFC Fight Night: Rosas Jr. vs. Barcelos
  # (Sat Sep 26, Meta APEX, main card 4:00 PM CT). Saturday-only so it cannot
  # fail daily the way the Sep 13/14 runs did. It lands ~8 hours before the
  # first bout, which is what the generator's STATUS_SCHEDULED guard needs.
  #
  # AFTER THIS CARD: retarget --start/--end at the next one, or comment this
  # cron back out. Left as-is it will fire next Saturday against an empty
  # window and fail loudly — which is the designed behaviour, but a failure
  # nobody acts on is the cry-wolf problem all over again.
  schedule:
    - cron: "0 13 * * 6"   # 08:00 CT Saturday
  workflow_dispatch:

concurrency:
  group: ufc-page
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the page with live prices
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -o pipefail
          # A human clicking Run always gets a fresh pull; the poll respects
          # the age guard so it doesn't spend a credit every two hours.
          AGE_GUARD="--max-age-hours 20"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && AGE_GUARD=""
          python3 scripts/build_ufc_page.py $AGE_GUARD \
            --start 2026-09-26 --end 2026-09-27 \
            --title "UFC Fight Night: Rosas Jr. vs. Barcelos" \
            --venue "Meta APEX, Las Vegas" \
            --datestr "Sat, Sep 26" 2>&1 | tee /tmp/ufc.log
          {
            echo "## UFC page build"
            echo '```'
            cat /tmp/ufc.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        run: |
          git config user.name  "ITN Desk"
          git config user.email "desk@insidethenumber.com"
          git add ufc.html
          if git diff --cached --quiet; then
            echo "no price movement — page unchanged"
          else
            git commit -m "UFC card: refresh prices"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Report failure loudly
        if: failure()
        run: |
          echo "::error title=UFC page build failed::Either the card has started \
          or finished (the generator refuses to publish stale odds), or the window \
          is empty. Retarget --start/--end at the next card."
