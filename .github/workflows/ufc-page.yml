name: UFC card page

# Regenerates ufc.html with fresh best-of-book prices. One Odds API credit
# per run.
#
# Daily through fight week so the "Prices updated" stamp stays honest —
# a static odds page with stale numbers is worse than no page, because the
# whole pitch is that the numbers are checked. The Saturday morning run lands
# before the card starts (fights begin ~5am CT / 10:00 UTC).
#
# After Saturday, switch the cron off (or retarget --start/--end at the next
# card) rather than letting it regenerate an empty window: the generator
# refuses to write a page with no fights, so a stale cron fails loudly
# instead of publishing junk.

on:
  # CRON DISABLED Aug 29 2026 after a live incident. Two independent bugs shipped
  # wrong data to the public page every two hours:
  #   1) fetch_odds() pulls EVERY mma_mixed_martial_arts event in the --start/--end
  #      window, not just the target card, so a second promotion's bouts were merged
  #      into the UFC page (tell: those rows quoted 1-2 books vs 6-7 for real fights).
  #   2) build() picks the "main event" by reverse-sorting that mixed list on
  #      commence_time, so a non-UFC fight was repeatedly labelled the headliner.
  # There is also no guard against the card being OVER — it kept publishing finished
  # fights as shoppable odds.
  # Do NOT re-enable until all three are fixed AND the output is checked against
  # ESPN's card roster for that event. Manual runs only.
  workflow_dispatch:

concurrency:
  group: ufc-page
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the page with live prices
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -o pipefail
          # A human clicking Run always gets a fresh pull; the poll respects
          # the age guard so it doesn't spend a credit every two hours.
          AGE_GUARD="--max-age-hours 20"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && AGE_GUARD=""
          python3 scripts/build_ufc_page.py $AGE_GUARD \
            --start 2026-08-29 --end 2026-08-30 \
            --title "UFC Fight Night Shanghai" \
            --venue "Shanghai, China" \
            --datestr "Sat, Aug 29" 2>&1 | tee /tmp/ufc.log
          {
            echo "## UFC page build"
            echo '```'
            cat /tmp/ufc.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        run: |
          git config user.name  "ITN Desk"
          git config user.email "desk@insidethenumber.com"
          git add ufc.html
          if git diff --cached --quiet; then
            echo "no price movement — page unchanged"
          else
            git commit -m "UFC card: refresh prices"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Report failure loudly
        if: failure()
        run: |
          echo "::error title=UFC page build failed::Empty fight window means the \
          card date passed -- retarget --start/--end or disable the cron."
